name: nylo_installer
description: CLI tool to create new Nylo Flutter projects. Quickly scaffold production-ready Flutter applications.
version: 1.10.0
homepage: https://nylo.dev
repository: https://github.com/nylo-core/nylo-installer
issue_tracker: https://github.com/nylo-core/nylo-installer/issues
documentation: https://github.com/nylo-core/nylo-installer
funding:
  - https://github.com/sponsors/agordn52
topics:
  - nylo-installer
  - nylo

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  analyzer: ^14.3.0
  args: ^2.7.0
  glob: ^2.2.0
  recase: ^4.1.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0

executables:
  nylo: nylo

screenshots:
  - description: Nylo logo.
    path: screenshots/logo.png